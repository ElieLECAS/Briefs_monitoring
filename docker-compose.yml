version: "3.8"
services:
    app:
        build:
            context: ./
        restart: unless-stopped
        container_name: app
        volumes:
            - ./reports:/app/reports
            - ./reference_data.csv:/app/reference_data.csv
            - ./X_test.csv:/app/X_test.csv
        ports:
            - "8000:8000"

        networks:
            example-network:
                ipv4_address: 172.16.238.10

    prometheus:
        image: prom/prometheus:latest
        restart: unless-stopped
        container_name: prometheus
        ports:
            - 9090:9090
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            example-network:
                ipv4_address: 172.16.238.11

    grafana:
        image: grafana/grafana
        container_name: grafana
        restart: unless-stopped
        depends_on:
            - prometheus
        ports:
            - 3000:3000
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning
        env_file:
            - ./grafana/config.monitoring
        networks:
            example-network:
                ipv4_address: 172.16.238.12

    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        restart: unless-stopped
        command:
            - "--path.rootfs=/host"
        volumes:
            - "/:/host:ro,rslave"
        ports:
            - 9100:9100
        networks:
            example-network:
                ipv4_address: 172.16.238.13

networks:
    example-network:
        name: example-network
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.16.238.0/24
